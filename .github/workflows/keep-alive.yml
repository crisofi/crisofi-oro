name: Keep Supabase Active

on:
  schedule:
    # Runs daily at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Active Supabase DB Query
        run: |
          # Clean URL formatting
          URL=$(echo "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" | sed 's/\/*$//' | xargs)

          # Query PostgREST OpenAPI schema definition to force a real database engine query
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/?apikey=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")

          echo "Supabase DB Query HTTP status: $STATUS"

          if [[ "$STATUS" -ne 200 ]]; then
            echo "Failed to query Supabase database."
            exit 1
          fi

      - name: Reset 60-Day GitHub Inactivity Timer
        run: |
          date -u > .github/last_ping.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last_ping.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: reset GitHub inactivity timer" && git push)